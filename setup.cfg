[metadata]
name = armie-retrieval-platform
version = 0.2.0
description = Production-oriented adaptive retrieval platform reference implementation
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = ARMIE AI Labs
keywords = ai, retrieval, rag, knowledge-graph, expert-discovery, evaluation
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: Software Development :: Libraries

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    networkx>=3.0

[options.packages.find]
where = src
