[metadata]
name = armie-retrieval-platform
version = 0.4.0
description = Production-oriented adaptive retrieval platform reference implementation
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = ARMIE AI Labs
keywords = ai, retrieval, rag, knowledge-graph, expert-discovery, evaluation
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Topic :: Software Development :: Libraries

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    faiss-cpu>=1.8.0
    networkx>=3.0
    numpy>=1.24,<2.0
    requests>=2.31
    sentence-transformers>=3.0
    PyYAML>=6.0
    fastapi>=0.110
    uvicorn>=0.29

[options.packages.find]
where = src
