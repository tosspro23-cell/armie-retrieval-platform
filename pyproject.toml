[project]
name = "armie-retrieval-platform"
version = "0.5.0"
description = "Production-oriented adaptive retrieval platform reference implementation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "ARMIE AI Labs"}]
keywords = ["ai", "retrieval", "rag", "knowledge-graph", "expert-discovery", "evaluation"]
dependencies = [
  "faiss-cpu>=1.8.0",
  "networkx>=3.0",
  "numpy>=1.24,<2.0",
  "requests>=2.31",
  "sentence-transformers>=3.0",
  "PyYAML>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
workbench = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
model-enhanced = ["sentence-transformers>=3.0"]
reranking = ["sentence-transformers>=3.0"]
elasticsearch = ["elasticsearch>=8.15,<9"]
v040 = ["elasticsearch>=8.15,<9"]

[build-system]
requires = ["setuptools>=58"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
