services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: armie-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "127.0.0.1:${ARMIE_ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - armie-elasticsearch-data:/usr/share/elasticsearch/data

volumes:
  armie-elasticsearch-data:
